<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asta FantaCalcio - Report Live</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            background: linear-gradient(135deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        button {
            padding: 10px 20px;
            background: #1e3a8a;
            color: #60a5fa;
            border: 1px solid #60a5fa;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #60a5fa;
            color: #0f172a;
        }
        
        .reports-list {
            display: grid;
            gap: 15px;
        }
        
        .report-item {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .report-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #475569;
        }
        
        .report-time {
            font-size: 12px;
            color: #94a3b8;
        }
        
        .report-num {
            font-weight: bold;
            color: #60a5fa;
            font-size: 14px;
        }
        
        .report-content {
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.5;
            background: #0f172a;
            padding: 12px;
            border-radius: 4px;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .report-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .report-content::-webkit-scrollbar-track {
            background: #1e293b;
        }
        
        .report-content::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 3px;
        }
        
        .empty {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }
        
        .status {
            text-align: center;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-size: 14px;
        }
        
        .status.listening {
            background: #065f46;
            color: #86efac;
            border: 1px solid #22c55e;
        }
        
        .status.waiting {
            background: #7c2d12;
            color: #fdba74;
            border: 1px solid #f97316;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Asta FantaCalcio — Report Live</h1>
        
        <div id="status" class="status waiting">
            ⏳ In attesa di report... Iniziate l'asta!
        </div>
        
        <div class="controls">
            <button onclick="loadReports()">🔄 Aggiorna</button>
            <button onclick="clearAll()">🗑️ Cancella tutto</button>
            <button onclick="downloadJSON()">⬇️ Scarica JSON</button>
        </div>
        
        <div id="reportsList" class="reports-list">
            <div class="empty">Nessun report ricevuto ancora.</div>
        </div>
    </div>

    <script>
        // Salva report in localStorage
        function saveReport(report, timestamp) {
            let reports = JSON.parse(localStorage.getItem('astaReports') || '[]');
            reports.push({
                id: reports.length + 1,
                report,
                timestamp,
                receivedAt: new Date().toISOString()
            });
            localStorage.setItem('astaReports', JSON.stringify(reports));
            return reports.length;
        }

        // Carica e visualizza i report
        function loadReports() {
            const reports = JSON.parse(localStorage.getItem('astaReports') || '[]');
            const container = document.getElementById('reportsList');
            const status = document.getElementById('status');
            
            if (reports.length === 0) {
                container.innerHTML = '<div class="empty">Nessun report ricevuto ancora.</div>';
                status.className = 'status waiting';
                status.textContent = '⏳ In attesa di report... Iniziate l\'asta!';
                return;
            }
            
            status.className = 'status listening';
            status.textContent = `✅ ${reports.length} report ricevuti. Ultimo: ${new Date(reports[reports.length - 1].receivedAt).toLocaleTimeString('it-IT')}`;
            
            container.innerHTML = reports.map(r => `
                <div class="report-item">
                    <div class="report-header">
                        <span class="report-num">#${r.id}</span>
                        <span class="report-time">${new Date(r.receivedAt).toLocaleTimeString('it-IT')}</span>
                    </div>
                    <div class="report-content">${escapeHtml(r.report)}</div>
                </div>
            `).reverse().join('');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function clearAll() {
            if (confirm('Sei sicuro? Cancellerai tutti i report.')) {
                localStorage.removeItem('astaReports');
                loadReports();
            }
        }

        function downloadJSON() {
            const reports = JSON.parse(localStorage.getItem('astaReports') || '[]');
            const json = JSON.stringify(reports, null, 2);
            const blob = new Blob([json], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `asta-reports-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        // Auto-load ogni 2 secondi
        setInterval(loadReports, 2000);
        
        // Carica subito
        loadReports();

        // Listen per postMessage dalla app (per refresh immediato)
        window.addEventListener('message', (e) => {
            if (e.data.type === 'report-sent') {
                loadReports();
            }
        });
    </script>
</body>
</html>
